name: Course ratings
summary: Students rate and review courses. The average rating is displayed on the course page and in course listings.
category: Ratings and reviews
description: |
  Course ratings allows students to add ratings and reviews to courses, and teachers and other
  users to read them.

  - The average course rating is stored in a custom course field that is created automatically.
    It is displayed in any course listing that shows custom course fields, for example the
    "All courses" page and the site home.
  - The current course rating is also added to each course home page.
  - Users can flag reviews, and managers can permanently delete the flagged ones.
  - By default every student enrolled in a course can leave a rating. It can be configured that
    only students who completed the course can do it.
  - Course ratings can be enabled or disabled for individual courses.
  - Optionally, reviews are written in the rich text editor. The colours of the stars and the
    rating are configurable.
